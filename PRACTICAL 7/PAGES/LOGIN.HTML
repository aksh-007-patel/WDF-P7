<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Student Hub</title>
    <link rel="stylesheet" href="../CSS/style.css" />
  </head>

  <body>
    <div class="container login-container">
      <div class="header-top-row">
        <span class="badge">Portal Login</span>
        <button type="button" class="theme-toggle-btn" aria-label="Toggle dark/light theme">
          <span class="theme-icon">🌙</span>
          <span class="theme-text">Dark mode</span>
        </button>
      </div>

      <h1>Student Hub</h1>
      <h2>Login Page</h2>

      <form action="DASHBOARD.HTML">
        <label>Username</label>
        <input
          type="text"
          name="username"
          placeholder="Enter username"
          required
        />

        <label>Password</label>
        <input
          type="password"
          name="password"
          placeholder="Enter password"
          required
        />

        <div class="buttons">
          <input type="submit" value="LOGIN" />
          <input type="reset" value="CLEAR" />
        </div>
      </form>

      <a href="../home.html" class="home-btn">← Back to Home</a>

      <hr />

      <footer>
        <p>&copy; 2026 Student Hub. All Rights Reserved.</p>
      </footer>
    </div>

    <script src="../JS/SCRIPT.JS"></script>
  </body>
</html>
